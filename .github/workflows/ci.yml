name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: the workflow only needs to read the repository contents.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch
# or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OpsFlow.sln

      - name: Build (Release)
        run: dotnet build OpsFlow.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test OpsFlow.sln --configuration Release --no-build

  frontend:
    name: Frontend (lint, test & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend/opsflow-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/opsflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
