server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # In production, Caddy proxies /api/* and /health/* directly to the API
    # container. nginx serves only the frontend static files and the SPA
    # fallback. This eliminates the second proxy hop.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
