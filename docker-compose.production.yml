# =============================================================================
# OpsFlow — production overlay
#
# Merge with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Verify merged config (no leaked ports):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml config
#
# Requires Docker Compose >= 2.24.4 (for !override YAML tag support).
#
# Key differences from the base (development) stack:
#   - SQL Server uses Express edition (free for production)
#   - Explicit network isolation (public / database) with pinned IPAM subnets
#   - Only Caddy exposes ports 80 and 443
#   - Caddy proxies API traffic directly (no nginx API hop)
#   - nginx serves only frontend static files (production.conf)
#   - ForwardedHeaders trusts only the Caddy container IP (172.30.10.10)
#   - All services use GHCR images pinned to exact commit-SHA tags
#   - All long-running services restart automatically
# =============================================================================

services:
  sqlserver:
    environment:
      MSSQL_PID: "Express"
    ports: !override []
    networks:
      - database
    restart: unless-stopped

  api:
    image: "${OPSFLOW_API_IMAGE:?OPSFLOW_API_IMAGE must be set}"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
      Seed__Enabled: "false"
      Cors__AllowedOrigins__0: "https://${OPSFLOW_DOMAIN:?OPSFLOW_DOMAIN must be set}"
      ForwardedHeaders__TrustedProxy: "172.30.10.10"
    ports: !override []
    networks:
      - public
      - database
    restart: unless-stopped

  web:
    image: "${OPSFLOW_WEB_IMAGE:?OPSFLOW_WEB_IMAGE must be set}"
    ports: !override []
    volumes:
      - ./deployment/nginx-production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: opsflow-caddy
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      OPSFLOW_DOMAIN: "${OPSFLOW_DOMAIN:?OPSFLOW_DOMAIN must be set}"
    networks:
      public:
        ipv4_address: 172.30.10.10
    restart: unless-stopped

networks:
  public:
    name: opsflow-public
    ipam:
      config:
        - subnet: 172.30.10.0/24
  database:
    name: opsflow-database
    internal: true

volumes:
  caddy-data:
    name: opsflow-caddy-data
  caddy-config:
    name: opsflow-caddy-config
