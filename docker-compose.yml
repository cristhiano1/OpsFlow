# =============================================================================
# OpsFlow — containerized local stack
#
# Start everything:
#   docker compose up -d --build
#
# Start only the database (non-containerized development):
#   docker compose --env-file .env.example up -d sqlserver
#
# The SA password and JWT key are never hardcoded; they are read from the
# environment (see .env.example / your local .env).
# =============================================================================

services:
  sqlserver:
    build:
      context: docker/sqlserver-fts
      dockerfile: Dockerfile
    container_name: opsflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set (see .env.example)}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - opsflow-sql-data-2025:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 ships in the 2025 image at /opt/mssql-tools18/bin.
      # The password is passed through the SQLCMDPASSWORD environment variable
      # rather than the -P flag, so it never appears in the container's process
      # list. $$ escapes the variable so Compose passes it literally and the
      # shell inside the container expands it against the container's environment.
      # -C trusts the server's self-signed development certificate.
      test:
        - "CMD-SHELL"
        - "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q \"SELECT 1\" -b -o /dev/null"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: opsflow-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__OpsFlow: "Server=sqlserver,1433;Database=OpsFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set (see .env.example)}"
      Jwt__Issuer: "OpsFlow"
      Jwt__Audience: "OpsFlow.Api"
      DocumentStorage__BasePath: "/app/storage"
      Seed__Enabled: "false"
      APPLY_MIGRATIONS: "${APPLY_MIGRATIONS:-true}"
    volumes:
      - opsflow-documents:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: opsflow-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  opsflow-sql-data-2025:
    name: opsflow-sql-data-2025
  opsflow-documents:
    name: opsflow-documents
