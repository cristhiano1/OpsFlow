# =============================================================================
# OpsFlow — containerized local stack
#
# Start everything:
#   docker compose up -d --build
#
# Start only the database (non-containerized development):
#   docker compose --env-file .env.example up -d sqlserver
#
# The SA password, JWT key, seed password, and provider credentials are never
# hardcoded here; they are read from the environment (see .env.example / .env).
# =============================================================================

services:
  sqlserver:
    build:
      context: docker/sqlserver-fts
      dockerfile: Dockerfile
    container_name: opsflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set (see .env.example)}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - opsflow-sql-data-2025:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q \"SELECT 1\" -b -o /dev/null"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: opsflow-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # The Compose stack is a local developer/demo environment by default so
      # it can create deterministic demo accounts on a fresh SQL volume. Set
      # ASPNETCORE_ENVIRONMENT=Production and SEED_ENABLED=false when using the
      # image in a production-like environment.
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__OpsFlow: "Server=sqlserver,1433;Database=OpsFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set (see .env.example)}"
      Jwt__Issuer: "OpsFlow"
      Jwt__Audience: "OpsFlow.Api"
      DocumentStorage__BasePath: "/app/storage"
      Seed__Enabled: "${SEED_ENABLED:-true}"
      Seed__DefaultPassword: "${SEED_DEFAULT_PASSWORD:?SEED_DEFAULT_PASSWORD must be set (see .env.example)}"
      APPLY_MIGRATIONS: "${APPLY_MIGRATIONS:-true}"
      OpenAI__ApiKey: "${OpenAI__ApiKey:-}"
      OpenAI__EmbeddingModel: "${OpenAI__EmbeddingModel:-text-embedding-3-small}"
      OpenAI__AnswerModel: "${OpenAI__AnswerModel:-gpt-4o-mini}"
      BedrockReranker__Region: "${BedrockReranker__Region:-eu-central-1}"
      BedrockReranker__ModelId: "${BedrockReranker__ModelId:-cohere.rerank-v3-5:0}"
      BedrockReranker__TimeoutSeconds: "${BedrockReranker__TimeoutSeconds:-30}"
      Reranking__ActivateInAnswerPath: "${Reranking__ActivateInAnswerPath:-false}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-eu-central-1}"
    volumes:
      - opsflow-documents:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: opsflow-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  opsflow-sql-data-2025:
    name: opsflow-sql-data-2025
  opsflow-documents:
    name: opsflow-documents
