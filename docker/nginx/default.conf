server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not expose nginx version
    server_tokens off;

    # Allow uploads up to 27 MiB (backend limit is 26 MiB at Kestrel level)
    client_max_body_size 27m;

    # Reverse proxy /api and /health to the backend container.
    # Synchronous document ingestion can legitimately take longer than nginx's
    # 60-second default while extracting, chunking, and generating embeddings.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: serve index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
